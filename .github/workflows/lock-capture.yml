name: Dependency Lock Capture

on:
  push:
    branches: [security/deterministic-web-dependencies]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Resolve workspace lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock if changed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already matches the resolved graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock web dependency graph"
          git push origin HEAD:${GITHUB_REF_NAME}
