name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bukmatika
          POSTGRES_PASSWORD: bukmatika
          POSTGRES_DB: bukmatika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bukmatika -d bukmatika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUKMATIKA_DATABASE_URL: postgresql+psycopg://bukmatika:bukmatika@localhost:5432/bukmatika
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install API
        run: python -m pip install -e "services/api[dev]"
      - name: Ruff import diagnostic
        run: ruff check services/api/src/bukmatika/library/portability_domain.py --fix --diff || true
      - name: Ruff
        run: ruff check services/api
      - name: MyPy
        run: mypy services/api/src
      - name: Migrate database
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Tests
        run: pytest -q services/api/tests

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run web:typecheck
      - name: Build
        run: npm run web:build
