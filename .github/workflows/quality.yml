name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bukmatika
          POSTGRES_PASSWORD: bukmatika
          POSTGRES_DB: bukmatika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bukmatika -d bukmatika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUKMATIKA_DATABASE_URL: postgresql+psycopg://bukmatika:bukmatika@localhost:5432/bukmatika
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install API
        run: python -m pip install -e "services/api[dev]"
      - name: Ruff
        run: ruff check services/api
      - name: MyPy
        run: mypy services/api/src
      - name: Migrate database
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Tests
        run: pytest -q services/api/tests

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run web:typecheck
      - name: Build
        run: npm run web:build

  browser:
    name: Browser quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bukmatika
          POSTGRES_PASSWORD: bukmatika
          POSTGRES_DB: bukmatika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bukmatika -d bukmatika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      BUKMATIKA_DATABASE_URL: postgresql+psycopg://bukmatika:bukmatika@localhost:5432/bukmatika
      BUKMATIKA_WEB_ORIGIN: http://127.0.0.1:3000
      BUKMATIKA_ACQUISITION_WORKER_ENABLED: "false"
      BUKMATIKA_DELEGATION_WORKER_ENABLED: "false"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install API
        run: python -m pip install -e "services/api[dev]"
      - name: Install web and browser runner
        run: npm install --no-audit --no-fund
      - name: Migrate database
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run web:build
      - name: Research browser journey
        run: npm run web:e2e
