name: bukmatika-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bukmatika
      POSTGRES_PASSWORD: bukmatika
      POSTGRES_DB: bukmatika
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bukmatika -d bukmatika"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    volumes:
      - bukmatika-postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  bukmatika-postgres-data:
