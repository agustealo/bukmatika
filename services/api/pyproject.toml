[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bukmatika-api"
version = "0.1.0"
description = "Bukmatika discovery, rights, catalog and acquisition API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.20,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "psycopg[binary,pool]>=3.3.6,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bukmatika"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["bukmatika"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bukmatika"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
